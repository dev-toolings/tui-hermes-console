name: hermes-console

services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [database]
    security_opt:
      - no-new-privileges:true

  migrate:
    image: hermes-console-migration:${HERMES_CONSOLE_VERSION:-local}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: migration
    restart: "no"
    environment:
      DATABASE_OWNER_URL: ${DATABASE_OWNER_URL:?DATABASE_OWNER_URL is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:?POSTGRES_RUNTIME_USER is required}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [database]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

  console:
    image: hermes-console:${HERMES_CONSOLE_VERSION:-local}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: runtime
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required}
      CONSOLE_APP_ORIGIN: ${CONSOLE_APP_ORIGIN:?CONSOLE_APP_ORIGIN is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_ALLOWED_EMAILS: ${GOOGLE_ALLOWED_EMAILS:?GOOGLE_ALLOWED_EMAILS is required}
      HERMES_BASE_URL: ${HERMES_BASE_URL:-}
      HERMES_RUNTIME_TOKEN: ${HERMES_RUNTIME_TOKEN:-}
      HERMES_PROTOCOL: ${HERMES_PROTOCOL:-agent}
      CONSOLE_SERVER_HOST: 0.0.0.0
      CONSOLE_SERVER_PORT: "3170"
      WEB_DIST_DIR: /app/apps/web/dist
      HERMES_CONSOLE_ARTIFACTS_DIR: /data/files
      HERMES_SSH_KNOWN_HOSTS_FILE: /data/ssh/known_hosts
      HERMES_SHARED_WORKDIR: /data/work
      CONSOLE_TRUST_PROXY: "1"
    volumes:
      - files-data:/data/files
      - work-data:/data/work
      - ssh-data:/data/ssh
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - const r=await fetch('http://127.0.0.1:3170/api/healthz');if(!r.ok)process.exit(1)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [edge, database]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      CONSOLE_SITE_ADDRESS: ${CONSOLE_SITE_ADDRESS:?CONSOLE_SITE_ADDRESS is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      console:
        condition: service_healthy
    networks: [edge]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

networks:
  edge:
  database:
    internal: true

volumes:
  postgres-data:
  files-data:
  work-data:
  ssh-data:
  caddy-data:
  caddy-config:
