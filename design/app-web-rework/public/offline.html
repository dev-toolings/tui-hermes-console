<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f3f4" />
    <title>Hermes Console — hors ligne</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100dvh;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom));
        background: #f7f7f7;
        color: #191919;
        font: 400 15px/1.5 Inter, ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 30rem; text-align: center; }
      .badge {
        display: inline-flex;
        width: 56px;
        height: 56px;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        background: linear-gradient(180deg, #3080ff 0%, #1447e6 100%);
        color: #fff;
        font-size: 22px;
        font-weight: 700;
      }
      h1 { margin: 1.25rem 0 0; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0.625rem 0 0; color: #5c5c63; }
      button {
        margin-top: 1.75rem;
        min-height: 44px;
        border: 0;
        border-radius: 10px;
        background: #155dfc;
        color: #fff;
        padding: 0 1.25rem;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button:active { transform: scale(0.97); }
      @media (prefers-color-scheme: dark) {
        body { background: #121212; color: #fafafa; }
        p { color: #a3a3a3; }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">H</span>
      <h1>Console hors ligne</h1>
      <p>
        Cette vue n'est pas encore en cache. Reconnecte-toi au réseau, puis relance la console.
        Les données locales de l'espace restent intactes sur cet appareil.
      </p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
