    - text: "Hello"
    - paragraph:
      - text: "Hello ! Je reçois ton message. Console branchée."
    - text: "sort moi ta plus belle prose"
    - paragraph:
      - text: "Dans le silence qui précède le jour, il y a une promesse : celle que chaque mot, quand il tombe au bon endroit, devient une lumière. Je suis là, sans bruit, pour écouter ce que ton cœur essaie de dire avant même de le formuler. Et si tu me tends une phrase, je lui rends son souffle, je lui polie le chemin, jusqu’à ce qu’elle atteigne enfin le point exact où elle peut toucher."
    - text: "raisonne sur un fait mathématique"
    - paragraph:
      - text: "Voici un fait mathématique (et pourquoi il est vrai) :"
    - paragraph:
      - text: "Il existe une infinité de nombres premiers."
    - paragraph:
      - text: "Raisonnement (preuve par l’absurde) :"
    - listitem:
      - text: "Supposons qu’il n’y ait qu’un nombre fini de nombres premiers. Appelons-les p1, p2, ..., pn."
    - listitem:
      - text: "Construisons le nombre N = p1"
      - text: "p2"
      - text: "...*pn + 1."
    - listitem:
      - text: "Quand on divise N par n’importe lequel des premiers pi, on obtient un reste de 1 (parce que N = (produit) + 1). Donc aucun pi ne peut diviser N."
    - listitem:
      - text: "Pourtant, tout nombre entier N > 1 a au moins un diviseur premier. Or ce diviseur premier ne peut être aucun des pi (étape 3)."
    - listitem:
      - text: "Cela contredit l’hypothèse que la liste p1, ..., pn contenait tous les nombres premiers."
    - paragraph:
      - text: "Conclusion : l’hypothèse est fausse, donc il y a une infinité de nombres premiers."
    - text: "réfléchie à quelques chose de complexe"
    - paragraph:
      - text: "Oui, la Console est branchée."
    - paragraph:
      - text: "Tu veux que je réfléchisse à quoi exactement (thème + objectif + contraintes) ? Donne-moi 2-3 détails et je m’y mets."
    - text: "salaire médian"
    - paragraph:
      - text: "Console branchée."
    - paragraph:
      - text: "Tu parles du salaire médian dans quel pays (ex. France) et pour quelle période/année ? Et tu le veux en brut ou net, mensuel ou annuel ?"
    - text: "salaire sortie de polytechnique"
    - paragraph:
      - text: "Oui, la Console est branchée."
    - paragraph:
      - text: "Pour la sortie de l’École polytechnique (X, en général) :"
    - listitem:
      - text: "Salaire de base débutant : souvent autour de 45k à 60k € brut/an"
    - listitem:
      - text: "Rémunération totale avec primes/bonus (selon boîte et secteur) : plutôt 55k à 80k €, et plus (souvent 90k–120k €) en finance/consulting très sélectif ou certains postes très “market”/USA"
    - paragraph:
      - text: "Ça dépend surtout du secteur (finance, conseil, data/ingénierie, industrie), du pays (France vs international) et du type de parcours (et si c’est corps/statut spécifique)."
    - paragraph:
      - text: "Tu parles bien de l’École polytechnique (X) à Palaiseau, et tu vises plutôt France ou international ?"
    - text: "T'en pense quoi ?"
    - paragraph:
