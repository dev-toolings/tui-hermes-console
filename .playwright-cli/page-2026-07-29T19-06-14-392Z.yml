    - paragraph:
      - text: "Je peux te dire mon avis, mais il me manque le contexte : tu parles de quoi exactement (“ça”/“ce truc”) ? Copie-colle le contenu ou envoie une capture et je te réponds."
    - text: "T'en pense quoi ?"
