<!doctype html>
<html lang="fr" class="antialiased">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : requis pour que env(safe-area-inset-*) fonctionne
         sur iOS. Pas de maximum-scale, le pinch-to-zoom reste accessible. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Pilotage d'un runtime Hermes : agents, missions, résultats." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fefefe" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="128x128" href="/brand/hermes-console-favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Hermes Console</title>
    <!--
      Applique le thème avant le premier paint pour éviter le flash clair.
      Inline volontairement : tout chargement différé produirait un FOUC.
      Repris du <head> de l'ancien layout racine Next.
    -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem("hermes-theme");
          var d =
            s === "dark" ||
            (s !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (d) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <!-- min-h-dvh, jamais 100vh : la barre d'URL mobile casserait la hauteur -->
  <body class="min-h-dvh bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
