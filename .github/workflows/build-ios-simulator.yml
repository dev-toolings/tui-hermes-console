name: Build iOS Simulator

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/core/**"
      - "bun.lock"
      - "package.json"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/core/**"
      - "bun.lock"
      - "package.json"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate iOS project
        run: bunx expo prebuild --platform ios --clean --no-install
        working-directory: apps/mobile
      - name: Install CocoaPods dependencies
        run: pod install
        working-directory: apps/mobile/ios
      - name: Build unsigned simulator app
        run: >-
          xcodebuild
          -workspace HermesConsole.xcworkspace
          -scheme HermesConsole
          -configuration Debug
          -sdk iphonesimulator
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
        working-directory: apps/mobile/ios
      - name: Upload simulator app for SimDeck
        uses: NativeScript/SimDeck/actions/upload-ios-simulator-app@v0.1.22
        with:
          app-glob: apps/mobile/ios/build/Build/Products/Debug-iphonesimulator/*.app
