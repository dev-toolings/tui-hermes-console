name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/core/**"
      - "bun.lock"
      - "package.json"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/core/**"
      - "bun.lock"
      - "package.json"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Android project
        run: bunx expo prebuild --platform android --clean --no-install
        working-directory: apps/mobile
      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: apps/mobile/android
      - name: Upload APK for SimDeck
        uses: NativeScript/SimDeck/actions/upload-android-apk@v0.1.22
        with:
          apk-glob: apps/mobile/android/app/build/outputs/apk/debug/*.apk
